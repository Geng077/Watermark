<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>水印工坊 · 本地 PDF / 图片水印工具</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">印</div>
        <div class="brand-text">
          <h1>水印工坊</h1>
          <p>本地运行的 PDF / 图片水印工具 · 文件不会离开你的设备</p>
        </div>
      </div>
    </header>

    <main class="layout">
      <aside class="panel">
        <!-- 文件 -->
        <section class="card">
          <div class="card-head">
            <span class="step">1</span>
            <h2>选择文件</h2>
          </div>
          <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="选择或拖入文件">
            <input type="file" id="fileInput" accept=".pdf,.png,.jpg,.jpeg,.webp" hidden />
            <div class="dz-icon">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 16V4m0 0L8 8m4-4l4 4" />
                <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" />
              </svg>
            </div>
            <p class="dz-title">拖入 PDF 或图片，或点击选择</p>
            <p class="dz-hint">支持 .pdf / .png / .jpg / .jpeg / .webp · 全部在本机处理</p>
          </div>
          <div id="fileInfo" class="file-info hidden">
            <div class="file-thumb">
              <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <path d="M14 2v6h6" />
              </svg>
            </div>
            <div class="file-text">
              <div id="fileName" class="file-name">未命名文件</div>
              <div id="fileMeta" class="file-meta">—</div>
            </div>
            <button id="changeFileBtn" class="btn btn-ghost btn-sm" type="button">更换</button>
          </div>
        </section>

        <!-- 设置 -->
        <section id="settingsCard" class="card hidden">
          <div class="card-head">
            <span class="step">2</span>
            <h2>水印设置</h2>
          </div>

          <!-- 类型 -->
          <div class="seg seg-2" id="typeSeg">
            <button class="seg-btn active" data-type="text" type="button">文字水印</button>
            <button class="seg-btn" data-type="image" type="button">图片水印</button>
          </div>

          <!-- 样式预设 -->
          <div class="field">
            <label class="field-label">样式预设</label>
            <div class="chips" id="presetChips">
              <button class="chip" data-preset="default" type="button">默认浅印</button>
              <button class="chip" data-preset="confidential" type="button">机密居中</button>
              <button class="chip" data-preset="stamp" type="button">红章</button>
              <button class="chip" data-preset="diagonal" type="button">斜排平铺</button>
              <button class="chip" data-preset="light" type="button">浅色平铺</button>
            </div>
          </div>

          <!-- 通用样式（文字 / 图片共用） -->
          <div class="field">
            <div class="field-label-row">
              <label class="field-label" for="opacityRange">不透明度</label>
              <span class="value-badge">
                <input id="opacityInput" class="num-input" type="number" min="1" max="100" step="1" value="40" inputmode="decimal" aria-label="不透明度数值" />
                <span class="unit">%</span>
              </span>
            </div>
            <input type="range" id="opacityRange" class="range" min="1" max="100" step="1" value="40" />
          </div>

          <div class="field">
            <div class="field-label-row">
              <label class="field-label" for="angleRange">倾斜角度</label>
              <span class="value-badge">
                <input id="angleInput" class="num-input" type="number" min="-180" max="180" step="1" value="-30" inputmode="decimal" aria-label="倾斜角度数值" />
                <span class="unit">°</span>
              </span>
            </div>
            <input type="range" id="angleRange" class="range" min="-180" max="180" step="1" value="-30" />
          </div>

          <!-- 文字设置 -->
          <div id="textSection">
            <div class="field">
              <label class="field-label" for="textInput">文字内容</label>
              <textarea id="textInput" class="input textarea" rows="2" placeholder="输入水印文字，可换行">水印</textarea>
            </div>

            <div class="field">
              <label class="field-label" for="fontSelect">字体</label>
              <select id="fontSelect" class="input"></select>
            </div>

            <div class="field">
              <div class="field-label-row">
                <label class="field-label" for="fontSizeRange">字号</label>
                <span class="value-badge">
                  <input id="fontSizeInput" class="num-input" type="number" min="8" max="300" step="1" value="64" inputmode="decimal" aria-label="字号数值" />
                  <span class="unit">pt</span>
                </span>
              </div>
              <input type="range" id="fontSizeRange" class="range" min="8" max="300" step="1" value="64" />
            </div>

            <div class="field">
              <div class="field-label-row">
                <label class="field-label">颜色</label>
                <label class="color-input-wrap" title="自定义颜色">
                  <input type="color" id="colorInput" value="#e11d48" />
                  <span class="color-hex" id="colorHex">#e11d48</span>
                </label>
              </div>
              <div class="swatches" id="colorSwatches"></div>
            </div>

            <div class="field">
              <div class="field-label-row">
                <label class="field-label" for="letterSpacingRange">字间距</label>
                <span class="value-badge">
                  <input id="letterSpacingInput" class="num-input" type="number" min="0" max="120" step="1" value="0" inputmode="decimal" aria-label="字间距数值" />
                  <span class="unit">pt</span>
                </span>
              </div>
              <input type="range" id="letterSpacingRange" class="range" min="0" max="120" step="1" value="0" />
            </div>

            <div class="field field-row">
              <label class="switch">
                <input type="checkbox" id="boldToggle" />
                <span class="switch-track"></span>
                <span class="switch-label">加粗</span>
              </label>
              <label class="switch">
                <input type="checkbox" id="outlineToggle" />
                <span class="switch-track"></span>
                <span class="switch-label">描边</span>
              </label>
              <label class="switch">
                <input type="checkbox" id="shadowToggle" />
                <span class="switch-track"></span>
                <span class="switch-label">阴影</span>
              </label>
            </div>
          </div>

          <!-- 图片水印设置 -->
          <div id="imageSection" class="hidden">
            <div class="field">
              <label class="field-label">水印图片</label>
              <div id="imageDropzone" class="image-dropzone" tabindex="0" role="button" aria-label="上传水印图片">
                <input type="file" id="watermarkImageInput" accept=".png,.jpg,.jpeg,.webp,.svg" hidden />
                <img id="watermarkImagePreview" class="hidden" alt="水印图片预览" />
                <div id="imageDropzoneEmpty" class="image-dropzone-empty">
                  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="3" />
                    <circle cx="8.5" cy="8.5" r="1.5" />
                    <path d="m21 15-5-5L5 21" />
                  </svg>
                  <span>上传图片（建议透明 PNG）</span>
                </div>
              </div>
              <button id="imageRemoveBtn" class="btn btn-ghost btn-sm hidden" type="button">移除图片</button>
            </div>

            <div class="field">
              <div class="field-label-row">
                <label class="field-label" for="imageScaleRange">图片缩放</label>
                <span class="value-badge">
                  <input id="imageScaleInput" class="num-input" type="number" min="2" max="120" step="1" value="30" inputmode="decimal" aria-label="图片缩放数值" />
                  <span class="unit">%</span>
                </span>
              </div>
              <input type="range" id="imageScaleRange" class="range" min="2" max="120" step="1" value="30" />
            </div>
          </div>

          <!-- 布局 -->
          <div class="field">
            <label class="field-label">布局方式</label>
            <div class="seg seg-2" id="layoutSeg">
              <button class="seg-btn active" data-layout="tile" type="button">平铺</button>
              <button class="seg-btn" data-layout="single" type="button">单个</button>
            </div>
          </div>

          <div id="positionSection" class="hidden">
            <div class="field">
              <label class="field-label">位置</label>
              <div class="pos-grid" id="positionGrid">
                <button data-pos="nw" type="button" aria-label="左上"></button>
                <button data-pos="n" type="button" aria-label="上"></button>
                <button data-pos="ne" type="button" aria-label="右上"></button>
                <button data-pos="w" type="button" aria-label="左"></button>
                <button data-pos="c" class="active" type="button" aria-label="居中"></button>
                <button data-pos="e" type="button" aria-label="右"></button>
                <button data-pos="sw" type="button" aria-label="左下"></button>
                <button data-pos="s" type="button" aria-label="下"></button>
                <button data-pos="se" type="button" aria-label="右下"></button>
              </div>
            </div>

            <div class="field">
              <div class="field-label-row">
                <label class="field-label" for="marginRange">边距</label>
                <span class="value-badge">
                  <input id="marginInput" class="num-input" type="number" min="0" max="300" step="1" value="40" inputmode="decimal" aria-label="边距数值" />
                  <span class="unit">pt</span>
                </span>
              </div>
              <input type="range" id="marginRange" class="range" min="0" max="300" step="1" value="40" />
            </div>

            <div class="field">
              <div class="field-label-row">
                <label class="field-label" for="offsetXRange">水平偏移</label>
                <span class="value-badge">
                  <input id="offsetXInput" class="num-input" type="number" min="-400" max="400" step="1" value="0" inputmode="decimal" aria-label="水平偏移数值" />
                  <span class="unit">pt</span>
                </span>
              </div>
              <input type="range" id="offsetXRange" class="range" min="-400" max="400" step="1" value="0" />
            </div>

            <div class="field">
              <div class="field-label-row">
                <label class="field-label" for="offsetYRange">垂直偏移</label>
                <span class="value-badge">
                  <input id="offsetYInput" class="num-input" type="number" min="-400" max="400" step="1" value="0" inputmode="decimal" aria-label="垂直偏移数值" />
                  <span class="unit">pt</span>
                </span>
              </div>
              <input type="range" id="offsetYRange" class="range" min="-400" max="400" step="1" value="0" />
            </div>
          </div>

          <div id="tileSection">
            <div class="field">
              <div class="field-label-row">
                <label class="field-label" for="tileGapXRange">水平间距</label>
                <span class="value-badge">
                  <input id="tileGapXInput" class="num-input" type="number" min="-200" max="600" step="1" value="60" inputmode="decimal" aria-label="水平间距数值" />
                  <span class="unit">pt</span>
                </span>
              </div>
              <input type="range" id="tileGapXRange" class="range" min="-200" max="600" step="1" value="60" />
            </div>

            <div class="field">
              <div class="field-label-row">
                <label class="field-label" for="tileGapYRange">垂直间距</label>
                <span class="value-badge">
                  <input id="tileGapYInput" class="num-input" type="number" min="-200" max="600" step="1" value="60" inputmode="decimal" aria-label="垂直间距数值" />
                  <span class="unit">pt</span>
                </span>
              </div>
              <input type="range" id="tileGapYRange" class="range" min="-200" max="600" step="1" value="60" />
            </div>
          </div>

          <!-- 层级 -->
          <div class="field" id="layerField">
            <label class="field-label">水印层级</label>
            <div class="seg seg-2" id="layerSeg">
              <button class="seg-btn active" data-layer="under" type="button">内容下方</button>
              <button class="seg-btn" data-layer="over" type="button">内容上方</button>
            </div>
          </div>

          <!-- 页面范围 -->
          <div class="field">
            <label class="field-label">应用于</label>
            <div class="seg seg-2" id="pagesSeg">
              <button class="seg-btn active" data-pages="all" type="button">全部页面</button>
              <button class="seg-btn" data-pages="range" type="button">指定页面</button>
            </div>
          </div>
          <div class="field hidden" id="pagesRangeWrap">
            <label class="field-label" for="pagesRange">页码（如 1-3,5,7）</label>
            <input type="text" id="pagesRange" class="input" value="1" />
          </div>
        </section>
      </aside>

      <!-- 预览 -->
      <section class="preview">
        <div class="preview-toolbar">
          <div class="preview-title">
            <span class="step">3</span>
            <h2>预览</h2>
            <span id="pageInfo" class="page-info hidden"></span>
          </div>
          <div class="preview-tools">
            <div class="pager hidden" id="pager">
              <button id="prevPageBtn" class="btn btn-ghost btn-sm" type="button" aria-label="上一页">‹</button>
              <span id="pageIndicator" class="page-indicator">1 / 1</span>
              <button id="nextPageBtn" class="btn btn-ghost btn-sm" type="button" aria-label="下一页">›</button>
            </div>
            <button id="downloadBtn" class="btn btn-primary" type="button" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 4v12m0 0 5-5m-5 5-5-5" />
                <path d="M4 18v2h16v-2" />
              </svg>
              下载水印文件
            </button>
          </div>
        </div>

        <div class="preview-stage">
          <div id="emptyState" class="empty-state">
            <div class="empty-icon">
              <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16v16H4z" rx="2" />
                <path d="M4 9h16M9 4v5" />
                <path d="M8 14l3 3 5-6" />
              </svg>
            </div>
            <p class="empty-title">选择文件后，这里会实时显示水印效果</p>
            <p class="empty-hint">所有调整（字体、角度、颜色、透明度、平铺…）都会即时反映在预览中</p>
          </div>
          <div class="canvas-scroll" id="canvasScroll">
            <canvas id="previewCanvas" class="hidden"></canvas>
          </div>
        </div>
      </section>
    </main>

    <footer class="statusbar">
      <span id="statusText">就绪</span>
      <span class="statusbar-right">水印工坊 · 完全本地处理，无需上传</span>
    </footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/pdf-lib.min.js"></script>
  <script src="vendor/fontkit.umd.min.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script src="fonts-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
